<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrenador de Debat</title>
  <meta name="description" content="Aprén a argumentar, refutar i parlar en públic: lliçons gamificades, repte diari amb rúbrica, sala de debat amb cronòmetre i panell docent.">
  <meta name="theme-color" content="#C2410C">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦇</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#view">Salta al contingut</a>
  <aside class="sidebar">
    <a class="brand" href="#inici"><span aria-hidden="true">🦇</span><span>Entrenador<br><b>de Debat</b></span></a>
    <nav class="nav" aria-label="Navegació principal">
      <a href="#inici"><span aria-hidden="true">🏠</span><em>Inici</em></a>
      <a href="#itinerari"><span aria-hidden="true">🗺️</span><em>Itinerari</em></a>
      <a href="#arena"><span aria-hidden="true">⚔️</span><em>Arena</em></a>
      <a href="#sala"><span aria-hidden="true">🎙️</span><em>Sala</em></a>
      <a href="#docent"><span aria-hidden="true">👩‍🏫</span><em>Docent</em></a>
      <a href="#perfil"><span aria-hidden="true">👤</span><em>Perfil</em></a>
    </nav>
    <div class="side-stats" aria-label="Ratxa i experiència">
      <span id="sideStreak" title="Dies de ratxa">🔥 0</span>
      <span id="sideXP" title="Experiència">⚡ 0</span>
    </div>
  </aside>

  <main id="view" tabindex="-1"></main>

  <dialog id="howDialog" aria-labelledby="howTitle">
    <h2 id="howTitle">Com t'avalue?</h2>
    <div id="howBody"></div>
    <div class="row"><button class="primary" id="howClose">Entesos</button></div>
  </dialog>

  <noscript><p style="padding:2rem">Esta aplicació necessita JavaScript.</p></noscript>

  <script src="js/content.js"></script>
  <script src="js/store.js"></script>
  <script src="js/lesson.js"></script>
  <script src="js/arena.js"></script>
  <script src="js/sala.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
